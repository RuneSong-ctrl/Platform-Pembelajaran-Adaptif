<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1E26"/>
      <stop offset="100%" stop-color="#2D313E"/>
    </linearGradient>
    <linearGradient id="brainGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="sparkGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded clay effect -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad512)"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
  
  <!-- Stylized Brain / Node Emblem -->
  <g transform="translate(106, 106)">
    <!-- Circuit lines -->
    <path d="M150 50 L150 110 M50 150 L110 150 M190 150 L250 150 M150 190 L150 250" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Central Core -->
    <circle cx="150" cy="150" r="75" fill="url(#brainGrad512)" filter="drop-shadow(0 12px 28px rgba(59,130,246,0.55))"/>
    <circle cx="150" cy="150" r="48" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="150" cy="150" r="22" fill="#1C1E26"/>
    
    <!-- Nodes -->
    <circle cx="150" cy="40" r="18" fill="url(#sparkGrad512)"/>
    <circle cx="260" cy="150" r="18" fill="url(#sparkGrad512)"/>
    <circle cx="150" cy="260" r="18" fill="url(#sparkGrad512)"/>
    <circle cx="40" cy="150" r="18" fill="url(#sparkGrad512)"/>
  </g>
</svg>
