<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1C1E26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduAdapt" />
    <meta
      name="description"
      content="Platform Pembelajaran Adaptif K-12 Berbasis AI Brain & Blockchain Vault"
    />

    <title>EduAdapt Platform Pembelajaran Adaptif K-12</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Session intro: plain CSS so it paints before the JS bundle arrives (and offline from the SW cache) -->
    <style>
      #intro {
        position: fixed; inset: 0; z-index: 99; /* below the notch strip (z 100) in globals.css */
        background: #F8F9FD; color: #1C1E26;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
        transition: opacity .38s cubic-bezier(.16,1,.3,1), transform .38s cubic-bezier(.16,1,.3,1);
      }
      #intro[hidden] { display: none; }
      #intro.out { opacity: 0; transform: scale(1.02); pointer-events: none; }
      #intro .skip {
        position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px;
        min-width: 44px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 9999px;
        background: #FFFFFF; color: #5A5E70; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
        box-shadow: 0 8px 18px -4px rgba(35,38,59,.08), inset 2px 2px 4px rgba(255,255,255,.95), inset -2.5px -2.5px 5px rgba(35,38,59,.06);
        animation: intro-fade .4s .6s both;
      }
      #intro .skip:focus-visible { outline: 2px solid #4B3B7A; outline-offset: 2px; }
      #intro .logo {
        width: 96px; height: 96px; border-radius: 32px; background: #FFFFFF;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 14px 30px -6px rgba(35,38,59,.09), 0 4px 12px -2px rgba(35,38,59,.05), inset 2.5px 2.5px 5px #FFFFFF, inset -3.5px -3.5px 8px rgba(35,38,59,.05);
        animation: intro-pop .7s cubic-bezier(.16,1,.3,1) both;
      }
      #intro .logo img { width: 64px; height: 64px; }
      #intro h1 { margin: 18px 0 0; font-size: 24px; line-height: 32px; font-weight: 800; letter-spacing: -.01em; animation: intro-rise .6s .35s cubic-bezier(.16,1,.3,1) both; }
      #intro .greet { margin: 4px 0 0; font-size: 14px; line-height: 22px; font-weight: 500; color: #5A5E70; text-align: center; animation: intro-rise .6s .5s cubic-bezier(.16,1,.3,1) both; }
      #intro .modes { display: flex; gap: 12px; margin-top: 32px; }
      #intro .mode { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: intro-rise .6s cubic-bezier(.16,1,.3,1) both; }
      #intro .mode:nth-child(1) { animation-delay: .8s; }
      #intro .mode:nth-child(2) { animation-delay: .92s; }
      #intro .mode:nth-child(3) { animation-delay: 1.04s; }
      #intro .tile {
        width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 22px -6px rgba(35,38,59,.12), inset 2px 2px 4px rgba(255,255,255,.7), inset -3px -3px 6px rgba(35,38,59,.08);
      }
      #intro .tile svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      /* each modality "acts" once, in turn: the eye looks, the sound pulses, the hand presses */
      #intro .mint { background: #D1EBE1; color: #1D5E4D; }
      #intro .mint svg { animation: intro-look .5s 1.5s cubic-bezier(.16,1,.3,1) both; }
      #intro .lavender { background: #E3DBF8; color: #4B3B7A; }
      #intro .lavender svg { animation: intro-pulse .5s 1.8s cubic-bezier(.16,1,.3,1) both; }
      #intro .butter { background: #FEE7B3; color: #785308; }
      #intro .butter svg { animation: intro-press .5s 2.1s cubic-bezier(.16,1,.3,1) both; }
      #intro .mode span { font-size: 11px; line-height: 15px; font-weight: 700; color: #5A5E70; }
      #intro .bar { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); width: 120px; height: 4px; border-radius: 9999px; background: #E6E4EE; overflow: hidden; animation: intro-fade .4s .4s both; }
      #intro .bar i { display: block; height: 100%; width: 100%; border-radius: inherit; background: #1C1E26; transform-origin: left; animation: intro-fill var(--intro-min, 2600ms) linear both; }
      #intro.waiting .bar i { animation: intro-wait 1.1s cubic-bezier(.65,0,.35,1) infinite alternate; transform-origin: center; }
      @keyframes intro-pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
      @keyframes intro-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes intro-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes intro-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes intro-wait { from { transform: translateX(-60%) scaleX(.35); } to { transform: translateX(60%) scaleX(.35); } }
      @keyframes intro-look { 50% { transform: scaleY(.15); } }
      @keyframes intro-pulse { 50% { transform: scale(1.18); } }
      @keyframes intro-press { 50% { transform: translateY(3px) scale(.92); } }
      @media (prefers-reduced-motion: reduce) {
        #intro *, #intro .bar i { animation-duration: .01ms !important; animation-delay: 0s !important; }
        #intro.waiting .bar i { animation: none; transform: scaleX(1); opacity: .35; }
        #intro { transition-duration: .2s; }
      }
    </style>
  </head>
  <body class="bg-[#F8F9FD] text-[#1C1E26] antialiased">
    <div id="intro" hidden role="status" aria-label="Memuat EduAdapt">
      <button type="button" class="skip">Lewati</button>
      <div class="logo"><img src="/brand/logo-256.png" alt="" width="64" height="64" /></div>
      <h1>EduAdapt</h1>
      <p class="greet">Siap belajar hari ini?</p>
      <div class="modes" aria-hidden="true">
        <div class="mode"><div class="tile mint"><svg viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg></div><span>Lihat</span></div>
        <div class="mode"><div class="tile lavender"><svg viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" /></svg></div><span>Dengar</span></div>
        <div class="mode"><div class="tile butter"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" /><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" /><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" /><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></svg></div><span>Praktik</span></div>
      </div>
      <div class="bar"><i></i></div>
    </div>
    <script>
      // Shows the intro once per "session": first open ever, a new day, or after 6 h away.
      (function () {
        var KEY = "eduadapt_last_open", GAP = 6 * 60 * 60 * 1000, now = Date.now();
        var el = document.getElementById("intro");
        var last = 0;
        try { last = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
        var touch = function () { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} };
        touch();
        document.addEventListener("visibilitychange", function () { if (document.hidden) touch(); });
        var newDay = new Date(last).toDateString() !== new Date(now).toDateString();
        var show = !last || newDay || now - last > GAP;
        if (!show || location.pathname.indexOf("/verify") === 0) { el.remove(); window.__introReady = function () {}; return; }

        var h = new Date().getHours();
        var part = h < 11 ? "pagi" : h < 15 ? "siang" : h < 18 ? "sore" : "malam";
        el.querySelector(".greet").textContent = "Selamat " + part + ". Siap belajar hari ini?";
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN = reduce ? 900 : 2600;
        el.style.setProperty("--intro-min", MIN + "ms");
        el.hidden = false;

        var ready = false, minDone = false, closed = false;
        var close = function () {
          if (closed) return; closed = true;
          el.classList.add("out");
          setTimeout(function () { el.remove(); }, 400);
        };
        var maybeClose = function () {
          if (ready && minDone) close();
          else if (minDone) el.classList.add("waiting"); // slow network: switch the bar to an indeterminate loop
        };
        setTimeout(function () { minDone = true; maybeClose(); }, MIN);
        setTimeout(close, 12000); // never trap the user if the app fails to boot
        el.querySelector(".skip").addEventListener("click", close);
        window.__introReady = function () { ready = true; maybeClose(); };
      })();
    </script>
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
